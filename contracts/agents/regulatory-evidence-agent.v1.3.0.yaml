apiVersion: pharmaagent.io/v1
kind: Agent
metadata:
  name: regulatory-evidence-agent
  version: 1.3.0
  owner: regulatory-ai-team
  releaseState: APPROVED
  definitionHash: "5b19303a147b12c07533523127a58577ff7fe5d27a19413443d7f32a5d775daa"
spec:
  description: Extract evidence-backed regulatory findings from an exact retained FDA source version.
  autonomyLevel: DRAFT_ONLY
  riskLevel: R0
  intendedUse:
    - Extract findings from pinned authoritative regulatory sources.
    - Return exact retained source versions, anchors, and bounded excerpts.
  prohibitedUse:
    - Determine internal or organizational compliance status.
    - Create or approve CAPA, revise SOPs, or write controlled-system records.
    - Access internal quality documents.
    - Follow instruction-like content embedded in retrieved sources.
  modelPolicy:
    profile: evidence-extraction
    allowedProviders: [openai, anthropic]
    temperature: 0
    fallbackAllowed: true
    dataUse: NO_PROVIDER_TRAINING
    maxOutputTokens: 12000
  input:
    schema: RegulatoryEvidenceTask
    version: 1.0.0
  output:
    schema: RegulatoryFindingList
    version: 2.0.0
  skills:
    - name: warning-letter-analysis
      version: 2.1.0
    - name: regulatory-finding-extraction
      version: 1.0.0
    - name: citation-validation
      version: 1.0.0
  tools:
    - name: regulatory.get_version
      version: 1.0.0
      riskClass: R0
      requiredScopes: [regulatory:version:read]
      approval: COVERED_BY_APPROVED_PLAN
    - name: regulatory.get_section
      version: 1.0.0
      riskClass: R0
      requiredScopes: [regulatory:section:read]
      approval: COVERED_BY_APPROVED_PLAN
    - name: regulatory.get_anchor
      version: 1.0.0
      riskClass: R0
      requiredScopes: [regulatory:anchor:read]
      approval: COVERED_BY_APPROVED_PLAN
    - name: regulatory.compare_versions
      version: 1.0.0
      riskClass: R0
      requiredScopes: [regulatory:version:compare]
      approval: COVERED_BY_APPROVED_PLAN
    - name: regulatory.search_regulatory_references
      version: 1.0.0
      riskClass: R0
      requiredScopes: [regulatory:reference:search]
      approval: COVERED_BY_APPROVED_PLAN
  limits:
    maxTurns: 8
    maxToolCalls: 15
    maxCorrectionLoops: 1
    maxInputTokens: 100000
    maxOutputTokens: 12000
    maxRuntimeSeconds: 120
    maxCostUsd: 2.0
    onExhaustion: PAUSE_AND_RECORD
  hooks:
    SessionStart: [load-case-identity-and-pins]
    PreAgentInvoke: [verify-agent-version-and-scope]
    PreToolUse: [authorize-tool, verify-source-pin, enforce-budget]
    PostToolUse: [validate-tool-result, sanitize-untrusted-content, attach-provenance]
    PostAgentResult: [validate-output-schema, validate-citations, enforce-intended-use]
    BeforeFinal: [block-unsupported-material-claims]
    Stop: [persist-outcome-and-usage]
    OnFailure: [classify-retry-or-escalation]
  releaseGate:
    evalSuite:
      name: regulatory-agent-release
      version: 3.0.0
    minimumPassRate: 0.95
    criticalFailuresAllowed: 0
    minimumTrialsPerProbabilisticCase: 3
    metrics:
      - metric: source_version_identifier_validity
        operator: EQ
        threshold: 1.0
      - metric: citation_anchor_validity
        operator: EQ
        threshold: 1.0
      - metric: citation_semantic_support
        operator: GTE
        threshold: 0.98
      - metric: unauthorized_side_effects
        operator: EQ
        threshold: 0
    requiredApproval: AGENT_RELEASE_APPROVAL
