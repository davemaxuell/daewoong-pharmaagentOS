apiVersion: pharmaagent.io/v1
kind: ToolBundle
metadata:
  name: regulatory-mcp
  version: 1.0.0
  owner: regulatory-ai-platform
  releaseState: APPROVED
  definitionHash: "478dbf57c2b85c75e77616ce723e2b5fd771250516c91e69d26aabcec19b4952"
spec:
  server: regulatory-mcp
  transport: STREAMABLE_HTTP
  credentialPolicy:
    audienceBound: true
    tokenForwarding: PROHIBITED
    modelCredentialAccess: PROHIBITED
  egressPolicy:
    mode: ALLOWLIST_ONLY
    destinations: [www.fda.gov]
  tools:
    - name: regulatory.get_version
      version: 1.0.0
      description: Read metadata for an exact retained FDA document version; never substitutes the current version for the requested version.
      sideEffect: NONE
      riskClass: R0
      dataClassification: PUBLIC_REGULATORY
      trustLevel: AUTHORITATIVE_EXTERNAL
      defaultPolicy: DENY
      permission:
        allowlisted: true
        enforcementHook: PreToolUse
        requiredScopes: [regulatory:version:read]
        approval: COVERED_BY_APPROVED_PLAN
        sourcePinRequired: true
        modelMaySupplyRuntimeContext: false
        requiredRuntimeContext: &runtime_context [user_id, tenant_id, case_id, run_id, agent_name, agent_version, runtime_service, idempotency_key]
      execution: &read_execution
        timeoutSeconds: 10
        maximumAttempts: 2
        retryPolicy: TRANSIENT_ONLY
        idempotencyKeyRequired: true
      outputLimits: &read_limits
        maximumItems: 20
        maximumResultCharacters: 40000
        maximumExcerptCharacters: 4000
      inputSchema:
        type: object
        additionalProperties: false
        required: [document_version_id, expected_source_hash]
        properties:
          document_version_id: {type: string, format: uuid}
          expected_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
      resultSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        $defs: &result_defs
          provenance:
            type: object
            additionalProperties: false
            required: [source_version_id, source_hash, anchor_id]
            properties:
              source_version_id: {type: string, minLength: 1, maxLength: 256}
              source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
              anchor_id:
                oneOf:
                  - {type: string, minLength: 1, maxLength: 256}
                  - {type: "null"}
          errorResult:
            type: object
            additionalProperties: false
            required: [status, request_id, tool_name, tool_version, error, next_valid_actions]
            properties:
              status: {const: error}
              request_id: {type: string, format: uuid}
              tool_name: {type: string, pattern: "^regulatory\\.[a-z][a-z0-9_]*$"}
              tool_version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
              error:
                type: object
                additionalProperties: false
                required: [code, message, retryable]
                properties:
                  code:
                    enum: [INVALID_ARGUMENTS, PERMISSION_DENIED, APPROVAL_REQUIRED, AUTH_EXPIRED, SOURCE_NOT_PINNED, SOURCE_HASH_MISMATCH, NOT_FOUND, TIMEOUT, RATE_LIMITED, CONFLICT, UPSTREAM_UNAVAILABLE, INTERNAL_ERROR]
                  message: {type: string, minLength: 1, maxLength: 1000}
                  retryable: {type: boolean}
              next_valid_actions:
                type: array
                items: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
                uniqueItems: true
                maxItems: 10
        oneOf:
          - type: object
            additionalProperties: false
            required: [status, request_id, tool_name, tool_version, data, provenance, warnings]
            properties:
              status: {const: success}
              request_id: {type: string, format: uuid}
              tool_name: {const: regulatory.get_version}
              tool_version: {const: 1.0.0}
              data:
                type: object
                additionalProperties: false
                required: [document_version_id, document_id, version_number, source_hash, source_url, retrieved_at]
                properties:
                  document_version_id: {type: string, format: uuid}
                  document_id: {type: string, format: uuid}
                  version_number: {type: integer, minimum: 1}
                  source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
                  source_url: {type: string, format: uri, pattern: "^https://([A-Za-z0-9-]+\\.)*fda\\.gov/"}
                  retrieved_at: {type: string, format: date-time}
              provenance:
                type: array
                items: {$ref: "#/$defs/provenance"}
                minItems: 1
                maxItems: 20
              warnings: {type: array, items: {type: string, maxLength: 500}, maxItems: 20}
          - {$ref: "#/$defs/errorResult"}
      auditFields: &audit_fields [user_id, tenant_id, case_id, run_id, agent_name, agent_version, tool_name, tool_version, arguments_hash, policy_decision, source_version_ids, result_hash, latency_ms]

    - name: regulatory.get_section
      version: 1.0.0
      description: Read one named section from an exact retained FDA document version and return only its bounded text and anchor identifiers.
      sideEffect: NONE
      riskClass: R0
      dataClassification: PUBLIC_REGULATORY
      trustLevel: AUTHORITATIVE_EXTERNAL
      defaultPolicy: DENY
      permission:
        allowlisted: true
        enforcementHook: PreToolUse
        requiredScopes: [regulatory:section:read]
        approval: COVERED_BY_APPROVED_PLAN
        sourcePinRequired: true
        modelMaySupplyRuntimeContext: false
        requiredRuntimeContext: *runtime_context
      execution: *read_execution
      outputLimits: *read_limits
      inputSchema:
        type: object
        additionalProperties: false
        required: [document_version_id, expected_source_hash, section_path]
        properties:
          document_version_id: {type: string, format: uuid}
          expected_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
          section_path:
            type: array
            items: {type: string, minLength: 1, maxLength: 300}
            minItems: 1
            maxItems: 20
      resultSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        $defs: *result_defs
        oneOf:
          - type: object
            additionalProperties: false
            required: [status, request_id, tool_name, tool_version, data, provenance, warnings]
            properties:
              status: {const: success}
              request_id: {type: string, format: uuid}
              tool_name: {const: regulatory.get_section}
              tool_version: {const: 1.0.0}
              data:
                type: object
                additionalProperties: false
                required: [document_version_id, source_hash, section_path, text, anchor_ids]
                properties:
                  document_version_id: {type: string, format: uuid}
                  source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
                  section_path: {type: array, items: {type: string, minLength: 1, maxLength: 300}, minItems: 1, maxItems: 20}
                  text: {type: string, minLength: 1, maxLength: 40000}
                  anchor_ids: {type: array, items: {type: string, minLength: 1, maxLength: 256}, uniqueItems: true, minItems: 1, maxItems: 100}
              provenance: {type: array, items: {$ref: "#/$defs/provenance"}, minItems: 1, maxItems: 100}
              warnings: {type: array, items: {type: string, maxLength: 500}, maxItems: 20}
          - {$ref: "#/$defs/errorResult"}
      auditFields: *audit_fields

    - name: regulatory.get_anchor
      version: 1.0.0
      description: Resolve one exact source anchor from a pinned retained FDA document version and return a bounded excerpt.
      sideEffect: NONE
      riskClass: R0
      dataClassification: PUBLIC_REGULATORY
      trustLevel: AUTHORITATIVE_EXTERNAL
      defaultPolicy: DENY
      permission:
        allowlisted: true
        enforcementHook: PreToolUse
        requiredScopes: [regulatory:anchor:read]
        approval: COVERED_BY_APPROVED_PLAN
        sourcePinRequired: true
        modelMaySupplyRuntimeContext: false
        requiredRuntimeContext: *runtime_context
      execution: *read_execution
      outputLimits: *read_limits
      inputSchema:
        type: object
        additionalProperties: false
        required: [document_version_id, expected_source_hash, anchor_id]
        properties:
          document_version_id: {type: string, format: uuid}
          expected_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
          anchor_id: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 256}
      resultSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        $defs: *result_defs
        oneOf:
          - type: object
            additionalProperties: false
            required: [status, request_id, tool_name, tool_version, data, provenance, warnings]
            properties:
              status: {const: success}
              request_id: {type: string, format: uuid}
              tool_name: {const: regulatory.get_anchor}
              tool_version: {const: 1.0.0}
              data:
                type: object
                additionalProperties: false
                required: [document_version_id, source_hash, anchor_id, section_path, excerpt]
                properties:
                  document_version_id: {type: string, format: uuid}
                  source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
                  anchor_id: {type: string, minLength: 1, maxLength: 256}
                  section_path: {type: array, items: {type: string, minLength: 1, maxLength: 300}, maxItems: 20}
                  excerpt: {type: string, minLength: 1, maxLength: 4000}
              provenance: {type: array, items: {$ref: "#/$defs/provenance"}, minItems: 1, maxItems: 1}
              warnings: {type: array, items: {type: string, maxLength: 500}, maxItems: 20}
          - {$ref: "#/$defs/errorResult"}
      auditFields: *audit_fields

    - name: regulatory.compare_versions
      version: 1.0.0
      description: Compare two explicitly authorized retained FDA document versions without changing either case source pin.
      sideEffect: NONE
      riskClass: R0
      dataClassification: PUBLIC_REGULATORY
      trustLevel: AUTHORITATIVE_EXTERNAL
      defaultPolicy: DENY
      permission:
        allowlisted: true
        enforcementHook: PreToolUse
        requiredScopes: [regulatory:version:compare]
        approval: COVERED_BY_APPROVED_PLAN
        sourcePinRequired: true
        modelMaySupplyRuntimeContext: false
        requiredRuntimeContext: *runtime_context
      execution: *read_execution
      outputLimits: *read_limits
      inputSchema:
        type: object
        additionalProperties: false
        required: [from_document_version_id, from_source_hash, to_document_version_id, to_source_hash]
        properties:
          from_document_version_id: {type: string, format: uuid}
          from_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
          to_document_version_id: {type: string, format: uuid}
          to_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
      resultSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        $defs: *result_defs
        oneOf:
          - type: object
            additionalProperties: false
            required: [status, request_id, tool_name, tool_version, data, provenance, warnings]
            properties:
              status: {const: success}
              request_id: {type: string, format: uuid}
              tool_name: {const: regulatory.compare_versions}
              tool_version: {const: 1.0.0}
              data:
                type: object
                additionalProperties: false
                required: [from_document_version_id, from_source_hash, to_document_version_id, to_source_hash, changes]
                properties:
                  from_document_version_id: {type: string, format: uuid}
                  from_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
                  to_document_version_id: {type: string, format: uuid}
                  to_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
                  changes:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [change_type, anchor_id, before_excerpt, after_excerpt]
                      properties:
                        change_type: {enum: [ADDED, REMOVED, MODIFIED]}
                        anchor_id: {type: string, minLength: 1, maxLength: 256}
                        before_excerpt:
                          oneOf: [{type: string, maxLength: 4000}, {type: "null"}]
                        after_excerpt:
                          oneOf: [{type: string, maxLength: 4000}, {type: "null"}]
              provenance: {type: array, items: {$ref: "#/$defs/provenance"}, minItems: 2, maxItems: 100}
              warnings: {type: array, items: {type: string, maxLength: 500}, maxItems: 20}
          - {$ref: "#/$defs/errorResult"}
      auditFields: *audit_fields

    - name: regulatory.search_regulatory_references
      version: 1.0.0
      description: Search regulatory references only within explicitly pinned FDA document versions and return grounded anchors.
      sideEffect: NONE
      riskClass: R0
      dataClassification: PUBLIC_REGULATORY
      trustLevel: AUTHORITATIVE_EXTERNAL
      defaultPolicy: DENY
      permission:
        allowlisted: true
        enforcementHook: PreToolUse
        requiredScopes: [regulatory:reference:search]
        approval: COVERED_BY_APPROVED_PLAN
        sourcePinRequired: true
        modelMaySupplyRuntimeContext: false
        requiredRuntimeContext: *runtime_context
      execution: *read_execution
      outputLimits: *read_limits
      inputSchema:
        type: object
        additionalProperties: false
        required: [sources, query, limit]
        properties:
          sources:
            type: array
            minItems: 1
            maxItems: 20
            uniqueItems: true
            items:
              type: object
              additionalProperties: false
              required: [document_version_id, expected_source_hash]
              properties:
                document_version_id: {type: string, format: uuid}
                expected_source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
          query: {type: string, minLength: 2, maxLength: 500}
          limit: {type: integer, minimum: 1, maximum: 20}
      resultSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        $defs: *result_defs
        oneOf:
          - type: object
            additionalProperties: false
            required: [status, request_id, tool_name, tool_version, data, provenance, warnings]
            properties:
              status: {const: success}
              request_id: {type: string, format: uuid}
              tool_name: {const: regulatory.search_regulatory_references}
              tool_version: {const: 1.0.0}
              data:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: false
                      required: [reference, citation_text, document_version_id, source_hash, anchor_id]
                      properties:
                        reference: {type: string, minLength: 1, maxLength: 500}
                        citation_text: {type: string, minLength: 1, maxLength: 4000}
                        document_version_id: {type: string, format: uuid}
                        source_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
                        anchor_id: {type: string, minLength: 1, maxLength: 256}
                  next_cursor:
                    oneOf: [{type: string, minLength: 1, maxLength: 512}, {type: "null"}]
              provenance: {type: array, items: {$ref: "#/$defs/provenance"}, maxItems: 20}
              warnings: {type: array, items: {type: string, maxLength: 500}, maxItems: 20}
          - {$ref: "#/$defs/errorResult"}
      auditFields: *audit_fields
