          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/letters/{letter_id}/reprocess:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    post:
      tags: [Administration]
      operationId: reprocessLetter
      summary: Queue controlled reprocessing without changing source evidence
      x-required-roles: [system_administrator]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocessRequest"
      responses:
        "202":
          description: Reprocessing accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /reviews/{summary_id}:
    parameters:
      - name: summary_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Reviews]
      operationId: reviewSummary
      summary: Approve, reject, or request revision of a versioned AI summary
      x-required-roles: [reviewer]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Recorded review decision and new review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    corporateOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A short-lived RS256 server-to-server assertion. Anonymous browser sessions receive
        viewer authority only; account login is not required.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page; clients must not parse it.
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CaseLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CaseEventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    RunEventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    LetterId:
      name: letter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepKey:
      name: step_key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,63}$'
    PlanVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated opaque key retained for safe retries.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    CaseIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated opaque key scoped by the service to the authenticated subject.
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'

  responses:
    BadRequest:
      description: Malformed request or cursor
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid corporate identity
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated principal lacks required permission
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found or intentionally concealed by authorization
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Request conflicts with current immutable version or workflow state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Declared request body exceeds the configured maximum size
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Strict request validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Route or user rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Required dependency is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ResearchCreate:
      additionalProperties: false
      properties:
        objective:
          maxLength: 2000
          minLength: 8
          title: Objective
          type: string
        language:
          default: ko
          enum:
          - en
          - ko
          title: Language
          type: string
        client_request_id:
          format: uuid
          title: Client Request Id
          type: string
      required:
      - objective
      - client_request_id
      title: CreateResearch
      type: object
    ResearchSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - objective
      - language
      - status
      - stage
      - revision
      - created_at
      - updated_at
      - started_at
      - finished_at
      - model_calls
      - max_model_calls
      - error_code
      - can_resume
      properties:
        id:
          type: string
          format: uuid
        objective:
          type: string
        language:
          type: string
          enum:
          - en
          - ko
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - stopped
          - failed
          - limit_reached
          - insufficient_evidence
        stage:
          type: string
        revision:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        model_calls:
          type: integer
          minimum: 0
        max_model_calls:
          type: integer
          minimum: 0
        error_code:
          type:
          - string
          - 'null'
        can_resume:
          type: boolean
    ResearchSource:
      type: object
      additionalProperties: false
      required:
      - id
      - chunk_id
      - letter_id
      - company
      - source_url
      - anchor
      - version_id
      - source_hash
      - chunk_hash
      - excerpt
      - version
      - posted_date
      properties:
        id:
          type: string
        chunk_id:
          type: string
        letter_id:
          type: string
        company:
          type: string
        source_url:
          type: string
        anchor:
          type: string
        version_id:
          type: string
        source_hash:
          type: string
        chunk_hash:
          type: string
        excerpt:
          type: string
        version:
          type: integer
          minimum: 1
        posted_date:
          type:
          - string
          - 'null'
          format: date
    ResearchEvent:
      type: object
      additionalProperties: false
      required:
      - sequence
      - kind
      - stage
      - created_at
      - data
      properties:
        sequence:
          type: integer
          minimum: 0
        kind:
          type: string
        stage:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          type: object
          description: 'Public action metadata only: query, counts, plan steps, source identifiers, or concise check
            feedback. Private model conversation and reasoning are excluded.'
    ResearchRun:
      allOf:
      - type: object
        required:
        - id
        - objective
        - language
        - status
        - stage
        - revision
        - created_at
        - updated_at
        - started_at
        - finished_at
        - model_calls
        - max_model_calls
        - error_code
        - can_resume
        properties:
          id:
            type: string
            format: uuid
          objective:
            type: string
          language:
            type: string
            enum:
            - en
            - ko
          status:
            type: string
            enum:
            - queued
            - running
            - completed
            - stopped
            - failed
            - limit_reached
            - insufficient_evidence
          stage:
            type: string
          revision:
            type: integer
            minimum: 0
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          started_at:
            type:
            - string
            - 'null'
            format: date-time
          finished_at:
            type:
            - string
            - 'null'
            format: date-time
          model_calls:
            type: integer
            minimum: 0
          max_model_calls:
            type: integer
            minimum: 0
          error_code:
            type:
            - string
            - 'null'
          can_resume:
            type: boolean
      - type: object
        required:
        - plan
        - sources
        - events
        - result
        properties:
          plan:
            type: array
            items:
              type: string
          sources:
            type: array
            items:
              $ref: '#/components/schemas/ResearchSource'
          events:
            type: array
            items:
              $ref: '#/components/schemas/ResearchEvent'
          result:
            type:
            - object
            - 'null'
            description: Checked human-review draft with title, cited findings, review questions, limitations and pinned
              sources; or an insufficient-evidence explanation. Never a compliance approval.
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ok }
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { enum: [ready, degraded] }
        checks:
          type: object
          additionalProperties:
            enum: [ok, unavailable]

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 300 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: [string, "null"], maxLength: 2000 }
        instance: { type: [string, "null"], format: uri-reference }
        request_id: { type: string, maxLength: 200 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    ReviewState:
      enum: [pending, auto_approved, approved, needs_revision, rejected]
    ScopeStatus:
      enum: [UNVERIFIED, IN_SCOPE_DRUGS, OUT_OF_SCOPE, AMBIGUOUS, SCOPE_CHANGED]
    ProcessLens:
      enum: [preventive, monitoring, retrospective]
    ChangeEventType:
      enum: [NEW, UPDATED, RESPONSE_ADDED, CLOSEOUT_ADDED, SOURCE_UNAVAILABLE, RESTORED, PARSE_FAILED, SCOPE_CHANGED, CORPUS_RETIRED]
    JobStatus:
      enum: [queued, running, succeeded, failed, dead_letter, cancelled]

    AgentCaseStatus:
      enum:
        - DRAFT
        - PLANNING
        - AWAITING_PLAN_APPROVAL
        - READY
        - RUNNING
        - WAITING_FOR_INPUT
        - WAITING_FOR_REVIEW
        - NEEDS_REVISION
        - COMPLETED
        - BLOCKED
        - FAILED
        - CANCELLED
        - STALE
    CaseSourceRole:
      enum: [PRIMARY_REGULATORY, SUPPORTING_REGULATORY]
    ApprovalStatus:
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED]
    PlanRiskLevel:
      enum: [R0, R1, R2, R3]

    CaseCreateRequest:
      type: object
      additionalProperties: false
      required: [title, objective, warning_letter_id, document_version_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        objective:
          type: string
          minLength: 1
          maxLength: 4000
        workflow_key:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,159}$'
          default: regulatory-impact-review
        warning_letter_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        source_role:
          allOf:
            - $ref: "#/components/schemas/CaseSourceRole"
          default: PRIMARY_REGULATORY

    CaseSourceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - case_id
        - warning_letter_id
        - document_id
        - document_version_id
        - document_version_number
        - source_role
        - source_sha256
        - source_url
        - pinned_by
        - created_at
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        warning_letter_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        document_version_number: { type: integer }
        source_role:
          $ref: "#/components/schemas/CaseSourceRole"
        source_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        source_url: { type: string }
        pinned_by: { type: string }
        created_at: { type: string, format: date-time }
        immutable:
          type: boolean
          const: true
          default: true

    CaseResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - objective
        - status
        - owner_subject
        - workflow_key
        - current_state_hash
        - sources
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        status:
          $ref: "#/components/schemas/AgentCaseStatus"
        owner_subject: { type: string }
        workflow_key: { type: string }
        current_state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CaseSourceResponse"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CasePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseResponse"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    StepLimits:
      type: object
      additionalProperties: false
      properties:
        max_turns:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        max_tool_calls:
          type: integer
          minimum: 0
          maximum: 500
          default: 20
        max_input_tokens:
          type: integer
          minimum: 1
          maximum: 2000000
          default: 100000
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 200000
          default: 20000
        max_runtime_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        max_cost_usd:
          type: number
          minimum: 0
          maximum: 10000
          default: 5.0

    PlanStepCreate:
      type: object
      additionalProperties: false
      required: [step_key, title, instructions, output_schema_ref, risk_level]
      properties:
        step_key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        title:
          type: string
          minLength: 1
          maxLength: 300
        instructions:
          type: string
          minLength: 1
          maxLength: 4000
        depends_on:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
          default: []
        agent_version_id: { type: [string, "null"], format: uuid, default: null }
        skill_version_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
        tool_version_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: string, format: uuid }
          default: []
        output_schema_ref:
          type: string
          minLength: 1
          maxLength: 255
        risk_level:
          $ref: "#/components/schemas/PlanRiskLevel"
        requires_approval: { type: boolean, default: false }
        limits:
          $ref: "#/components/schemas/StepLimits"

    CasePlanCreateRequest:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        objective:
          type: [string, "null"]
          minLength: 1
          maxLength: 4000
          default: null
        plan_schema_version:
          type: string
          const: 1.0.0
          default: 1.0.0
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlanStepCreate"
        assigned_reviewer_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          default: null

    PlanStepResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - position
        - step_key
        - title
        - instructions
        - depends_on
        - agent_version_id
        - skill_version_ids
        - tool_version_ids
        - output_schema_ref
        - risk_level
        - requires_approval
        - limits
        - created_at
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        step_key: { type: string }
        title: { type: string }
        instructions: { type: string }
        depends_on:
          type: array
          items: { type: string }
        agent_version_id: { type: [string, "null"], format: uuid }
        skill_version_ids:
          type: array
          items: { type: string, format: uuid }
        tool_version_ids:
          type: array
          items: { type: string, format: uuid }
        output_schema_ref: { type: string }
        risk_level:
          $ref: "#/components/schemas/PlanRiskLevel"
        requires_approval: { type: boolean }
        limits:
          $ref: "#/components/schemas/StepLimits"
        created_at: { type: string, format: date-time }

    ApprovalResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - approval_type
        - status
        - requested_by
        - assigned_reviewer_id
        - decision_by
        - decision_reason
        - decided_at
        - expires_at
        - plan_sha256
        - bound_state_hash
        - created_at
      properties:
        id: { type: string, format: uuid }
        approval_type: { const: PLAN_APPROVAL }
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        requested_by: { type: string }
        assigned_reviewer_id: { type: [string, "null"] }
        decision_by: { type: [string, "null"] }
        decision_reason: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        plan_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        bound_state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        created_at: { type: string, format: date-time }

    CasePlanResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - case_id
        - version
        - objective
        - plan_schema_version
        - plan_sha256
        - based_on_state_hash
        - workflow_template_version_id
        - prohibited_actions
        - created_by
        - created_at
        - steps
        - approval
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        version: { type: integer }
        objective: { type: string }
        plan_schema_version: { type: string }
        plan_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        based_on_state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        workflow_template_version_id:
          type: [string, "null"]
          format: uuid
        prohibited_actions:
          type: array
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStepResponse"
        approval:
          $ref: "#/components/schemas/ApprovalResponse"

    PlanDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_plan_sha256, expected_state_hash, reason]
      properties:
        decision: { enum: [approve, reject] }
        expected_plan_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expected_state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        reason:
          type: string
          minLength: 1
          maxLength: 2000

    CaseEventResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - case_id
        - sequence
        - event_type
        - actor_type
        - actor_id
        - request_id
        - payload
        - previous_event_hash
        - event_hash
        - state_hash
        - occurred_at
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        sequence: { type: integer }
        event_type: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        request_id: { type: string }
        payload:
          type: object
          additionalProperties: true
        previous_event_hash:
          type: [string, "null"]
          pattern: '^[a-f0-9]{64}$'
        event_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        occurred_at: { type: string, format: date-time }

    CaseEventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseEventResponse"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    RunStartRequest:
      type: object
      additionalProperties: false
      required: [plan_version, expected_plan_sha256, expected_state_hash]
      properties:
        plan_version: { type: integer, minimum: 1 }
        expected_plan_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expected_state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'

    RunControlRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    InvocationUsage:
      type: object
      additionalProperties: false
      required: [turns, tool_calls, input_tokens, output_tokens, runtime_seconds, cost_usd]
      properties:
        turns: { type: integer, minimum: 0, default: 0 }
        tool_calls: { type: integer, minimum: 0, default: 0 }
        input_tokens: { type: integer, minimum: 0, default: 0 }
        output_tokens: { type: integer, minimum: 0, default: 0 }
        runtime_seconds: { type: number, minimum: 0, default: 0 }
        cost_usd: { type: number, minimum: 0, default: 0 }

    StepResultRequest:
      type: object
      additionalProperties: false
      required: [expected_invocation_id, output]
      properties:
        expected_invocation_id: { type: string, format: uuid }
        output:
          type: object
          additionalProperties: true
        usage:
          $ref: "#/components/schemas/InvocationUsage"

    StepApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_approval_id, reason]
      properties:
        decision: { enum: [approve, reject] }
        expected_approval_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    WorkflowBindingResponse:
      type: object
      additionalProperties: false
      required: [id, workflow_key, version, manifest_sha256]
      properties:
        id: { type: string, format: uuid }
        workflow_key: { type: string }
        version: { type: string }
        manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'

    RunStepStateResponse:
      type: object
      additionalProperties: false
      required: [status, attempt, invocation_id, approval_id, output_sha256, usage]
      properties:
        status:
          enum: [PENDING, RUNNING, WAITING_FOR_APPROVAL, COMPLETED, BLOCKED, FAILED, CANCELLED]
        attempt: { type: integer, minimum: 0 }
        invocation_id: { type: [string, "null"], format: uuid }
        approval_id: { type: [string, "null"], format: uuid }
        output_sha256:
          type: [string, "null"]
          pattern: '^[a-f0-9]{64}$'
        usage:
          $ref: "#/components/schemas/InvocationUsage"

    RunCheckpointResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - checkpoint_version
        - step_key
        - workflow_template
        - steps
        - budget
        - pause_requested
        - cancel_requested
      properties:
        schema_version: { const: pharmaagent-run-state@1.0.0 }
        checkpoint_version: { type: integer, minimum: 1 }
        step_key: { type: [string, "null"] }
        workflow_template:
          $ref: "#/components/schemas/WorkflowBindingResponse"
        steps:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RunStepStateResponse"
        budget:
          $ref: "#/components/schemas/InvocationUsage"
        pause_requested: { type: boolean }
        cancel_requested: { type: boolean }

    AgentInvocationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - run_id
        - case_id
        - plan_step_id
        - step_key
        - attempt
        - agent_version_id
        - status
        - output_schema_ref
        - input_sha256
        - output_sha256
        - limits
        - usage
        - error_code
        - started_at
        - completed_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        plan_step_id: { type: string, format: uuid }
        step_key: { type: string }
        attempt: { type: integer, minimum: 1 }
        agent_version_id: { type: [string, "null"], format: uuid }
        status:
          enum: [PENDING, RUNNING, WAITING_FOR_APPROVAL, COMPLETED, BLOCKED, FAILED, CANCELLED]
        output_schema_ref: { type: string }
        input_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        output_sha256:
          type: [string, "null"]
          pattern: '^[a-f0-9]{64}$'
        limits:
          type: object
          additionalProperties: true
        usage:
          $ref: "#/components/schemas/InvocationUsage"
        error_code: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    CaseRunResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - case_id
        - plan_id
        - plan_version
        - plan_sha256
        - bound_state_hash
        - status
        - requested_by
        - checkpoint
        - active_invocation
        - error_code
        - started_at
        - completed_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        plan_version: { type: integer, minimum: 1 }
        plan_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        bound_state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          enum: [PENDING, RUNNING, PAUSED, WAITING_FOR_APPROVAL, COMPLETED, BLOCKED, FAILED, CANCELLED]
        requested_by: { type: string }
        checkpoint:
          $ref: "#/components/schemas/RunCheckpointResponse"
        active_invocation:
          anyOf:
            - $ref: "#/components/schemas/AgentInvocationResponse"
            - type: "null"
        error_code: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    RunEventResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - run_id
        - case_id
        - sequence
        - event_type
        - actor_type
        - actor_id
        - request_id
        - payload
        - previous_event_hash
        - event_hash
        - occurred_at
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        event_type: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        request_id: { type: string }
        payload:
          type: object
          additionalProperties: true
        previous_event_hash:
          type: [string, "null"]
          pattern: '^[a-f0-9]{64}$'
        event_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        occurred_at: { type: string, format: date-time }

    RunEventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunEventResponse"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    CursorPage:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    LetterSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - company_name
        - country
        - canonical_url
        - issuing_offices
        - normalized_product_classes
        - scope_status
        - current_in_scope
        - lifecycle_status
        - first_seen_at
        - last_seen_at
      properties:
        id: { type: string, format: uuid }
        company_name: { type: string }
        country: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        canonical_url: { type: string, format: uri }
        marcs_cms_number: { type: [string, "null"] }
        issue_date: { type: [string, "null"], format: date }
        posted_date: { type: [string, "null"], format: date }
        issuing_offices:
          type: array
          items: { type: string }
        normalized_product_classes:
          type: array
          contains: { const: Drugs }
          items: { type: string }
        scope_status: { const: IN_SCOPE_DRUGS }
        current_in_scope: { const: true }
        lifecycle_status: { enum: [active, unavailable, closed] }
        drug_subtypes:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        review_state: { $ref: "#/components/schemas/ReviewState" }
        has_response: { type: boolean }
        has_closeout: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    LetterPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          additionalProperties: false
          required: [items, next_cursor, has_more, enforced_scope]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/LetterSummary" }
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
            enforced_scope: { const: "FDA Product: Drugs" }

    Evidence:
      type: object
      additionalProperties: false
      required: [source_anchor, excerpt]
      properties:
        source_anchor: { type: string }
        excerpt: { type: string }
        official_url: { type: string, format: uri }

    Finding:
      type: object
      additionalProperties: false
      required: [id, label, finding, categories, process_lenses, regulatory_references, evidence, comparison_points, attention_level, confidence, review_state]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        finding: { type: string }
        categories:
          type: array
          items: { type: string }
        process_lenses:
          type: array
          items: { $ref: "#/components/schemas/ProcessLens" }
        regulatory_references:
          type: array
          items: { type: string }
        evidence:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Evidence" }
        fda_requested_actions:
          type: array
          items: { type: object }
        comparison_points:
          type: array
          items: { type: string }
        attention_level: { enum: [low, medium, high, unknown] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        review_state: { $ref: "#/components/schemas/ReviewState" }

    DocumentVersion:
      type: object
      additionalProperties: false
      required: [id, document_id, version_number, retrieved_at, raw_sha256, canonical_body_sha256, parser_version, scope_status, source_url]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        document_type: { enum: [warning_letter, response, closeout, attachment] }
        retrieved_at: { type: string, format: date-time }
        raw_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        canonical_body_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        parser_version: { type: string }
        scope_status: { $ref: "#/components/schemas/ScopeStatus" }
        source_url: { type: string, format: uri }
        normalized_markdown: { type: [string, "null"] }

    LetterDetail:
      type: object
      additionalProperties: false
      required: [letter, documents, findings, ai_artifacts, lifecycle, enforced_scope]
      properties:
        letter: { $ref: "#/components/schemas/LetterSummary" }
        executive_summary: { type: [string, "null"] }
        documents:
          type: array
          items: { $ref: "#/components/schemas/DocumentVersion" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        ai_artifacts:
          type: array
          items: { $ref: "#/components/schemas/LetterAiArtifact" }
        lifecycle:
          type: array
          items: { $ref: "#/components/schemas/ChangeEvent" }
        enforced_scope: { const: "FDA Product: Drugs" }

    LetterAiArtifact:
      type: object
      additionalProperties: false
      required: [id, document_version_id, artifact_type, language, content, provider, model_id, prompt_version, source_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        artifact_type: { enum: [translation, findings, summary] }
        language: { const: ko }
        content:
          type: object
          additionalProperties: true
        provider: { type: string }
        model_id: { type: string }
        prompt_version: { type: string }
        source_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: string, format: date-time }

    VersionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentVersion" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    ChangeEvent:
      type: object
      additionalProperties: false
      required: [id, warning_letter_id, event_type, detected_at, notification_state]
      properties:
        id: { type: string, format: uuid }
        warning_letter_id: { type: string, format: uuid }
        document_id: { type: [string, "null"], format: uuid }
        event_type: { $ref: "#/components/schemas/ChangeEventType" }
        before_version_id: { type: [string, "null"], format: uuid }
        after_version_id: { type: [string, "null"], format: uuid }
        detected_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        notification_state: { enum: [pending, sent, suppressed, failed] }

    ChangePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChangeEvent" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    RagFilters:
      type: object
      additionalProperties: false
      properties:
        letter_id: { type: [string, "null"], format: uuid }
        letter_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        company: { type: [string, "null"], maxLength: 300 }
        issuing_office: { type: [string, "null"], maxLength: 200 }
        category: { type: [string, "null"], maxLength: 300 }
        regulation: { type: [string, "null"], maxLength: 200 }
        drug_subtype: { type: [string, "null"], maxLength: 150 }
        issue_date_from: { type: [string, "null"], format: date }
        issue_date_to: { type: [string, "null"], format: date }
        posted_from: { type: string, format: date }
        posted_to: { type: string, format: date }
        issuing_offices:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        companies:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 300 }
        drug_subtypes:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        categories:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 300 }
        regulatory_references:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 200 }
        include_responses: { type: boolean, default: true }
        include_closeouts: { type: boolean, default: true }

    RagConversationMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { enum: [user, assistant] }
        content:
          type: string
          minLength: 1
          maxLength: 2000

    RagQueryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 2000
        language: { enum: [auto, en, ko], default: auto }
        filters: { $ref: "#/components/schemas/RagFilters" }
        conversation_history:
          type: array
          maxItems: 8
          default: []
          items: { $ref: "#/components/schemas/RagConversationMessage" }
        max_sources: { type: integer, minimum: 1, maximum: 10, default: 5 }
        product_scope: { type: [string, "null"], enum: [Drugs, null], default: null }
        thread_id: { type: [string, "null"], format: uuid }
        client_message_id: { type: [string, "null"], minLength: 1, maxLength: 100 }
        retrieval_mode:
          enum: [auto, none, metadata, letter, corpus]
          default: auto
          description: >-
            auto lets the planner choose model-only conversation, metadata, a selected
            letter, or corpus evidence. none permits model conversation without any
            document retrieval; greetings and service help remain deterministic.
        model_profile:
          enum: [auto, fast, balanced, deep]
          default: auto

    Citation:
      type: object
      additionalProperties: false
      required: [chunk_id, warning_letter_id, company_name, document_type, source_anchor, excerpt, source_url, score]
      properties:
        chunk_id: { type: string, format: uuid }
        warning_letter_id: { type: string, format: uuid }
        company_name: { type: string }
        title: { type: [string, "null"] }
        document_type: { type: string }
        issue_date: { type: [string, "null"], format: date }
        posted_date: { type: [string, "null"], format: date }
        source_anchor: { type: string }
        excerpt: { type: string }
        source_url: { type: string, format: uri }
        score: { type: number }
        document_version_id: { type: [string, "null"], format: uuid }
        source_version: { type: [string, "null"], maxLength: 100 }
        source_hash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }

    RagQueryResponse:
      type: object
      additionalProperties: false
      required:
        - query_id
        - answer
        - interpretation_label
        - scope_label
        - filters_applied
        - evidence_sufficiency
        - citations
        - notice
        - retrieval_strategy
        - route_reason
        - requested_model_profile
        - effective_model_profile
        - attempted_model_id
        - effective_model_id
        - generation_used
        - generated_at
      properties:
        query_id: { type: string, format: uuid }
        answer: { type: string }
        interpretation_label: { enum: [source_facts, ai_synthesis, internal_comparison] }
        scope_label: { const: "FDA Product: Drugs" }
        filters_applied: { type: object, additionalProperties: true }
        evidence_sufficiency:
          description: >-
            Sufficient when at least one selected citation matches two or more meaningful query
            tokens; partial when citations exist but every selected citation matches only one;
            insufficient when no citation is retrieved.
          enum: [sufficient, partial, insufficient]
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        notice: { type: string }
        thread_id: { type: [string, "null"], format: uuid }
        user_message_id: { type: [string, "null"], format: uuid }
        assistant_message_id: { type: [string, "null"], format: uuid }
        focused_document_version_id: { type: [string, "null"], format: uuid }
        retrieval_strategy: { enum: [none, metadata, letter, multi_letter, corpus] }
        route_reason: { type: string }
        requested_model_profile: { enum: [auto, fast, balanced, deep] }
        effective_model_profile: { enum: [fast, balanced, deep] }
        attempted_model_id:
          type: [string, "null"]
          description: Provider model invoked, including an attempt whose output failed validation.
        effective_model_id:
          type: [string, "null"]
          description: Provider model whose output is actually present in this answer.
        generation_used:
          type: boolean
          description: True only when validated AI output is present in the returned answer.
        generated_at: { type: string, format: date-time }

    RagStreamEvent:
      description: One UTF-8 JSON object followed by a newline.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, phase]
          properties:
            type: { const: phase }
            phase: { enum: [retrieving, generating, validating] }
        - type: object
          additionalProperties: false
          required: [type, attempt, text]
          properties:
            type: { const: draft_delta }
            attempt: { type: integer, minimum: 1 }
            text: { type: string, minLength: 1 }
        - type: object
          additionalProperties: false
          required: [type, attempt]
          properties:
            type: { const: draft_reset }
            attempt: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type: { const: complete }
            data: { $ref: "#/components/schemas/RagQueryResponse" }
        - type: object
          additionalProperties: false
          required: [type, code, message]
          properties:
            type: { const: error }
            code: { type: string }
            message: { type: string }

    ChatThreadCreate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200, default: "새 대화" }
        model_preference: { enum: [auto, fast, balanced, deep], default: auto }
        retrieval_preference: { enum: [auto, none, metadata, letter, corpus], default: auto }
        active_letter_ids:
          type: array
          maxItems: 20
          default: []
          items: { type: string, format: uuid }

    ChatThreadPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        model_preference: { enum: [auto, fast, balanced, deep] }
        retrieval_preference: { enum: [auto, none, metadata, letter, corpus] }
        active_letter_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        archived: { type: boolean }

    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - sequence
        - role
        - content
        - status
        - citations
        - route_metadata
        - model_metadata
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        role: { enum: [user, assistant] }
        content: { type: string }
        status: { enum: [pending, completed, failed, cancelled] }
        client_message_id: { type: [string, "null"] }
        rag_query_id: { type: [string, "null"], format: uuid }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        route_metadata: { type: object, additionalProperties: true }
        model_metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatDocumentFocusSelect:
      type: object
      additionalProperties: false
      required: [assistant_message_id, chunk_id]
      properties:
        assistant_message_id: { type: string, format: uuid }
        chunk_id: { type: string, format: uuid }

    ChatDocumentFocus:
      type: object
      additionalProperties: false
      required:
        - warning_letter_id
        - document_id
        - document_version_id
        - source_chunk_id
        - source_message_id
        - selected_at
      properties:
        warning_letter_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        source_chunk_id: { type: string, format: uuid }
        source_message_id: { type: string, format: uuid }
        selected_at: { type: string, format: date-time }

    ChatThreadSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - model_preference
        - retrieval_preference
        - active_letter_ids
        - focus
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model_preference: { enum: [auto, fast, balanced, deep] }
        retrieval_preference: { enum: [auto, none, metadata, letter, corpus] }
        active_letter_ids:
          type: array
          items: { type: string, format: uuid }
        focus:
          oneOf:
            - $ref: "#/components/schemas/ChatDocumentFocus"
            - type: "null"
        archived_at: { type: [string, "null"], format: date-time }
        last_message_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatThreadDetail:
      allOf:
        - $ref: "#/components/schemas/ChatThreadSummary"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }

    ChatThreadPage:
      type: object
      additionalProperties: false
      required: [items, page, limit, total, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatThreadSummary" }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }

    TaxonomyItem:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: [string, "null"] }
    Taxonomy:
      type: object
      additionalProperties: false
      required: [taxonomy_version, required_product_class, categories, drug_subtypes, process_lenses]
      properties:
        taxonomy_version: { type: string }
        required_product_class: { const: Drugs }
        categories:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyItem" }
        drug_subtypes:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyItem" }
        process_lenses:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyItem" }

    IngestionRun:
      type: object
      additionalProperties: false
      required: [id, run_type, status, requested_by, created_at, counters]
      properties:
        id: { type: string, format: uuid }
        run_type: { enum: [discovery, backfill, lifecycle, reprocess, integrity_sample] }
        status: { $ref: "#/components/schemas/JobStatus" }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        counters: { type: object, additionalProperties: true }
        error_code: { type: [string, "null"] }

    IngestionRunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngestionRun" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    RuntimeConfiguration:
      type: object
      additionalProperties: false
      required: [application_version, parser_version, scope_rule_version, taxonomy_version, chunker_version, ai_provider, ai_model_id, ai_prompt_version, ai_configured, corpus_backfill_years, corpus_active_retention_years, smtp_delivery_enabled, smtp_configured]
      properties:
        application_version: { type: string }
        parser_version: { type: string }
        scope_rule_version: { type: string }
        taxonomy_version: { type: string }
        chunker_version: { type: string }
        ai_provider: { enum: [none, gemini, openai] }
        ai_model_id: { type: string }
        ai_prompt_version: { type: string }
        ai_configured: { type: boolean }
        corpus_backfill_years: { type: integer, minimum: 1 }
        corpus_active_retention_years: { type: integer, minimum: 1 }
        smtp_delivery_enabled: { type: boolean }
        smtp_configured: { type: boolean }

    NotificationSettings:
      type: object
      additionalProperties: false
      required: [subscription_id, target_email, enabled, event_types, smtp_delivery_enabled, smtp_configured, queued_deliveries, failed_deliveries, last_delivered_at, updated_at]
      properties:
        subscription_id: { type: string, format: uuid }
        target_email: { type: string, format: email }
        enabled: { type: boolean }
        event_types:
          type: array
          items: { enum: [NEW, UPDATED] }
        smtp_delivery_enabled: { type: boolean }
        smtp_configured: { type: boolean }
        queued_deliveries: { type: integer, minimum: 0 }
        failed_deliveries: { type: integer, minimum: 0 }
        last_delivered_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        target_email: { type: string, format: email, maxLength: 320 }
        enabled: { type: boolean }

    CreateIngestionRun:
      type: object
      additionalProperties: false
      required: [run_type, reason]
      properties:
        run_type: { enum: [discovery, backfill, lifecycle, integrity_sample] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        change_ticket: { type: [string, "null"], maxLength: 200 }
        options:
          type: object
          additionalProperties: false
          properties:
            date_from: { type: string, format: date }
            date_to: { type: string, format: date }
            force_conditional_fetch: { type: boolean, default: false }

    ReprocessRequest:
      type: object
      additionalProperties: false
      required: [stages, reason]
      properties:
        stages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [scope, parse, summarize, embed, publish, notify]
        source_version_id: { type: [string, "null"], format: uuid }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        change_ticket: { type: [string, "null"], maxLength: 200 }

    JobAccepted:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { const: queued }

    ReviewRequest:
      type: object
      additionalProperties: false
      required: [reason]
      oneOf:
        - required: [decision]
        - required: [state]
      properties:
        decision: { enum: [approve, needs_revision, reject] }
        state:
          description: Compatibility alias using persisted review-state values.
          enum: [approved, needs_revision, rejected]
        reason: { type: string, minLength: 3, maxLength: 2000 }
        expected_summary_version: { type: string, minLength: 1, maxLength: 200 }
        edited_executive_summary: { type: [string, "null"], minLength: 10, maxLength: 20000 }
        edited_structured_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        edited_output:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        change_ticket: { type: [string, "null"], maxLength: 200 }

    ReviewResult:
      type: object
      additionalProperties: false
      required: [review_id, source_summary_id, resulting_summary_id, source_document_version_id, resulting_revision, review_state, reviewed_by, reviewed_at, content_changed, request_id]
      properties:
        review_id: { type: string, format: uuid }
        source_summary_id: { type: string, format: uuid }
        resulting_summary_id: { type: string, format: uuid }
        source_document_version_id: { type: string, format: uuid }
        resulting_revision: { type: integer, minimum: 1 }
        review_state: { $ref: "#/components/schemas/ReviewState" }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time }
        content_changed: { type: boolean }
        request_id: { type: string }

    AiSummary:
      type: object
      additionalProperties: false
      required: [id, document_version_id, parent_summary_id, revision, executive_summary, language, review_state, validation_report, taxonomy_version, created_at]
      properties:
        id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        parent_summary_id: { type: [string, "null"], format: uuid }
        revision: { type: integer, minimum: 1 }
        executive_summary: { type: string }
        language: { type: string }
        review_state: { $ref: "#/components/schemas/ReviewState" }
        validation_report: { type: object, additionalProperties: true }
        taxonomy_version: { type: string }
        created_at: { type: string, format: date-time }

    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [summary, company_name, warning_letter_id, source_url, failed_checks, marcs_cms_number, related_open_items, confidence, high_attention]
      properties:
        summary: { $ref: "#/components/schemas/AiSummary" }
        company_name: { type: string }
        warning_letter_id: { type: string, format: uuid }
        source_url: { type: string, format: uri }
        marcs_cms_number: { type: [string, "null"] }
        related_open_items: { type: integer, minimum: 1 }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        high_attention: { type: boolean }
        failed_checks:
          type: array
          items: { type: string }

    ReviewQueuePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, previous_cursor, has_more, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewQueueItem" }
        next_cursor: { type: [string, "null"] }
        previous_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    SavedViewCriteria:
      type: object
      additionalProperties: false
      properties:
        query: { type: [string, "null"], maxLength: 300 }
        drug_subtype: { type: [string, "null"], maxLength: 200 }
        category: { type: [string, "null"], maxLength: 300 }
        country: { type: [string, "null"], maxLength: 120 }
        lifecycle_state:
          type: [string, "null"]
          enum: [ACTIVE, NEW, UPDATED, RESPONSE_ADDED, CLOSEOUT_ADDED, RESTORED, null]
        review_state:
          type: [string, "null"]
          enum: [auto_approved, approved, needs_revision, rejected, null]
        linked_document:
          type: [string, "null"]
          enum: [response, closeout, open, null]
        posted_from: { type: [string, "null"], format: date }
        posted_to: { type: [string, "null"], format: date }

    SavedViewCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 1000, default: "" }
        criteria: { $ref: "#/components/schemas/SavedViewCriteria" }
        cadence: { enum: [off, immediate, daily, weekly], default: off }

    SavedViewPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        criteria: { $ref: "#/components/schemas/SavedViewCriteria" }
        cadence: { enum: [off, immediate, daily, weekly] }

    SavedView:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - criteria
        - frequency
        - channel
        - active
        - alert_state
        - result_count
        - last_matched
        - owner_id
        - open_url
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        criteria: { $ref: "#/components/schemas/SavedViewCriteria" }
        frequency: { enum: [immediate, daily, weekly] }
        channel: { type: string }
        active: { type: boolean }
        alert_state:
          enum: [off, ready, delivery_unavailable, digest_scheduler_unavailable]
        result_count: { type: integer, minimum: 0 }
        last_matched: { type: [string, "null"], format: date }
        owner_id: { type: string }
        open_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SavedViewPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedView" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

security:
  - corporateOidc: []
