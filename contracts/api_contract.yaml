openapi: 3.1.0
info:
  title: FDA Drug Warning Letter Intelligence API
  version: 0.1.0
  summary: Internal evidence-first API for FDA Product=Drugs warning letters
  license:
    name: Proprietary - Daewoong Pharmaceutical internal use
    identifier: LicenseRef-Proprietary
  description: >-
    Draft implementation contract. Business endpoints always enforce canonical FDA
    Product=Drugs scope server-side. Caller-controlled product-scope expansion is not supported.
servers:
  - url: /api/v1
    description: Same-origin API base
tags:
  - name: Research
    description: Durable browser-owned FDA research with bounded tools and visible execution events.
  - name: Letters
    description: Authorized Drug-only warning-letter browsing and immutable source history.
  - name: Cases
    description: Versioned agent cases, immutable source pins, reviewable plans, and hash-chained history.
  - name: Changes
    description: Versioned warning-letter lifecycle and source-state changes.
  - name: RAG
    description: Agent-routed grounded retrieval over the authorized FDA Product=Drugs corpus.
  - name: Chat
    description: Owner-scoped persistent conversations and model/retrieval preferences.
  - name: Taxonomy
    description: Active controlled pharmaceutical finding vocabulary.
  - name: Reviews
    description: Attributable human review of versioned AI-derived content.
  - name: Administration
    description: Controlled ingestion and reprocessing operations.
  - name: Health
    description: Orchestrator liveness and dependency-readiness probes.

paths:
  /research/runs:
    get:
      tags:
      - Research
      operationId: listResearch
      summary: List the current browser owner’s 30 most recently updated research tasks
      responses:
        '200':
          description: Owner-scoped task summaries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResearchSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Research
      operationId: createResearch
      summary: Save an idempotent FDA research objective for background execution
      description: Viewer-accessible, owner-scoped research over saved current FDA Drug sources only. Two active and
        ten daily tasks per owner; 100 daily tasks globally. Each run retains a 12-model-call and 90,000-token budget
        across retries. Same client_request_id and payload returns the original task; changed payload conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchCreate'
      responses:
        '201':
          description: 'Private browser-owner-scoped research data. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /research/runs/{run_id}:
    parameters:
    - name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Research
      operationId: getResearch
      summary: Read a task, pinned sources, checked result and incremental execution events
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        '200':
          description: 'Private browser-owner-scoped research data. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /research/runs/{run_id}/{action}:
    parameters:
    - name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: action
      in: path
      required: true
      schema:
        type: string
        enum:
        - stop
        - resume
    post:
      tags:
      - Research
      operationId: controlResearch
      summary: Stop or resume an owned research task
      description: Stop revokes the worker lease so late writes cannot overwrite it. Resume accepts stopped/failed
        tasks with remaining budget and at most three resumes. Budgets are not reset.
      responses:
        '200':
          description: 'Private browser-owner-scoped research data. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/live:
    get:
      tags: [Health]
      operationId: live
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      tags: [Health]
      operationId: ready
      summary: Service readiness
      security: []
      responses:
        "200":
          description: Required local dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /letters:
    get:
      tags: [Letters]
      operationId: listLetters
      summary: List authorized, current in-scope Drug warning letters
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator, security_auditor]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: posted_from
          in: query
          schema: { type: string, format: date }
        - name: posted_to
          in: query
          schema: { type: string, format: date }
        - name: issuing_office
          in: query
          schema: { type: string, maxLength: 300 }
        - name: company
          in: query
          schema: { type: string, maxLength: 300 }
        - name: drug_subtype
          in: query
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { type: string, maxLength: 300 }
        - name: process_lens
          in: query
          schema:
            $ref: "#/components/schemas/ProcessLens"
        - name: regulatory_reference
          in: query
          schema: { type: string, maxLength: 200 }
        - name: has_response
          in: query
          schema: { type: boolean }
        - name: has_closeout
          in: query
          schema: { type: boolean }
        - name: review_state
          in: query
          schema:
            $ref: "#/components/schemas/ReviewState"
        - name: lifecycle_state
          in: query
          schema:
            enum: [active, unavailable, closed, retired_by_retention]
      responses:
        "200":
          description: Cursor page of authorized Drug letters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /letters/catalog:
    get:
      tags: [Letters]
      operationId: getLetterCatalog
      summary: Load a bounded batch of current in-scope Drug letter metadata
      description: SQL pagination precedes metadata enrichment; original document sections are excluded.
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator, security_auditor]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: Cursor page of authorized Drug letter metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Invalid pagination parameters
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /letters/{letter_id}:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    get:
      tags: [Letters]
      operationId: getLetter
      summary: Get one authorized Drug warning-letter lifecycle
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator, security_auditor]
      responses:
        "200":
          description: Evidence-first letter detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /letters/{letter_id}/versions:
    parameters:
      - $ref: "#/components/parameters/LetterId"
    get:
      tags: [Letters]
      operationId: listLetterVersions
      summary: List retained source versions for an authorized Drug letter
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator, security_auditor]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Immutable version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /letters/{letter_id}/ai-artifacts/{artifact_type}:
    parameters:
      - $ref: "#/components/parameters/LetterId"
      - name: artifact_type
        in: path
        required: true
        schema:
          enum: [translation, findings, summary]
    post:
      tags: [Letters]
      operationId: generateLetterAiArtifact
      summary: Generate or reuse a source-version-bound Korean letter artifact
      description: Returns a validated cached artifact when one already exists for the current retained FDA source version.
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      responses:
        "200":
          description: Persisted translation, findings, or summary artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterAiArtifact"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: Provider output failed closed validation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /cases:
    post:
      tags: [Cases]
      operationId: createCase
      summary: Create a case with one exact retained Drug source-version pin
      description: >-
        Creates a case owned by the authenticated subject and pins the requested warning-letter
        document version and canonical SHA-256. Replaying the same subject-scoped idempotency key
        with the same body returns the original case with status 201.
      x-required-roles: [analyst, system_owner]
      x-idempotency-scope: authenticated-subject
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseCreateRequest"
      responses:
        "201":
          description: Created case with immutable source pin and controlled planning-state hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Cases]
      operationId: listCases
      summary: List cases visible to the authenticated identity
      description: >-
        Analysts see only cases they own. Reviewers, domain SMEs, system owners, and auditors see
        all cases. Results are ordered by updated_at descending and then case ID.
      x-required-roles: [analyst, reviewer, domain_sme, system_owner, auditor]
      x-authorization-scope: analyst-owner-or-global-case-reader
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CaseLimit"
        - name: status
          in: query
          schema:
            anyOf:
              - $ref: "#/components/schemas/AgentCaseStatus"
              - type: "null"
      responses:
        "200":
          description: Cursor page of visible cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: getCase
      summary: Get a case and its exact source pins
      description: >-
        Available to the case owner or a reviewer, domain SME, system owner, or auditor.
      x-required-roles: [reviewer, domain_sme, system_owner, auditor]
      x-owner-access: true
      responses:
        "200":
          description: Case header and immutable source pins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{case_id}/plans:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [Cases]
      operationId: createCasePlan
      summary: Create an immutable plan version and its approval request
      description: >-
        The case-owner analyst or a system owner may create a plan. The objective must equal the
        case planning-input objective, dependency references must point to preceding steps, and
        every supplied registry version must be APPROVED or PRODUCTION. The assigned reviewer,
        when present, must be independent from both the case owner and plan creator.
      x-required-roles: [analyst, system_owner]
      x-authorization-scope: analyst-must-own-case
      x-idempotency-scope: authenticated-subject-and-case
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasePlanCreateRequest"
      responses:
        "201":
          description: Versioned plan bound to the exact case state and a pending approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePlanResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{case_id}/plans/{version}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - $ref: "#/components/parameters/PlanVersion"
    get:
      tags: [Cases]
      operationId: getCasePlan
      summary: Get one immutable case-plan version and approval binding
      description: >-
        Available to the case owner or a reviewer, domain SME, system owner, or auditor.
      x-required-roles: [reviewer, domain_sme, system_owner, auditor]
      x-owner-access: true
      responses:
        "200":
          description: Exact plan version, ordered steps, hashes, and approval state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePlanResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{case_id}/plans/{version}/approve:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - $ref: "#/components/parameters/PlanVersion"
    post:
      tags: [Cases]
      operationId: decideCasePlan
      summary: Approve or reject an exact current plan binding
      description: >-
        Only an independent reviewer may decide a pending, unexpired approval assigned to that
        reviewer (or unassigned). The submitted plan and state hashes, approval binding, latest
        plan version, case state, and awaiting-approval status must all still match. An expired
        request is persistently closed and moves the case to NEEDS_REVISION before returning 409.
      x-required-roles: [reviewer]
      x-separation-of-duties: case-owner-and-plan-creator-denied
      x-idempotency-scope: authenticated-subject-and-case
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanDecisionRequest"
      responses:
        "200":
          description: Plan with terminal approval decision and attributable reviewer metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePlanResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{case_id}/events:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [Cases]
      operationId: listCaseEvents
      summary: List an ordered case event hash chain
      description: >-
        Available to the case owner or a reviewer, domain SME, system owner, or auditor. Events
        are returned in ascending sequence order.
      x-required-roles: [reviewer, domain_sme, system_owner, auditor]
      x-owner-access: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CaseEventLimit"
      responses:
        "200":
          description: Cursor page of append-only case events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseEventPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cases/{case_id}/runs:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [Case runs]
      operationId: startCaseRun
      summary: Start a durable run from the latest exactly approved plan
      x-required-roles: [analyst, system_owner]
      x-authorization-scope: analyst-must-own-case
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunStartRequest" }
      responses:
        "201":
          description: Persisted run and queued first orchestration transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Case runs]
      operationId: getCaseRun
      summary: Get a durable run, checkpoint projection, and active invocation
      x-required-roles: [analyst, reviewer, domain_sme, system_owner, auditor]
      x-owner-access: true
      responses:
        "200":
          description: Exact run binding and current persisted state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/pause:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Case runs]
      operationId: pauseCaseRun
      summary: Interrupt an active run at its persisted boundary
      x-required-roles: [analyst, system_owner]
      x-owner-access: true
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunControlRequest" }
      responses:
        "200":
          description: Paused run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs/{run_id}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Case runs]
      operationId: resumeCaseRun
      summary: Resume a paused run after revalidating all immutable release bindings
      x-required-roles: [analyst, system_owner]
      x-owner-access: true
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunControlRequest" }
      responses:
        "200":
          description: Resumed or re-queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Case runs]
      operationId: cancelCaseRun
      summary: Cancel a non-terminal run and close pending work
      x-required-roles: [analyst, system_owner]
      x-owner-access: true
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunControlRequest" }
      responses:
        "200":
          description: Cancelled run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Case runs]
      operationId: listRunEvents
      summary: Stream or page the ordered run-event hash chain
      x-required-roles: [analyst, reviewer, domain_sme, system_owner, auditor]
      x-owner-access: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/RunEventLimit"
      responses:
        "200":
          description: Run timeline as JSON or newline-delimited JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEventPage" }
            application/x-ndjson:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/steps/{step_key}/result:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/StepKey"
    post:
      tags: [Case runs]
      operationId: submitRunStepResult
      summary: Submit one structured specialist result under enforced step limits
      x-internal-runtime-endpoint: true
      x-required-roles: [service, system_owner]
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepResultRequest" }
      responses:
        "200":
          description: Accepted result and queued next transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{run_id}/steps/{step_key}/approval:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/StepKey"
    post:
      tags: [Case runs]
      operationId: decideRunStepApproval
      summary: Independently approve or reject an exact step invocation
      x-required-roles: [reviewer]
      parameters:
        - $ref: "#/components/parameters/CaseIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepApprovalDecisionRequest" }
      responses:
        "200":
          description: Run after the attributable approval decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRunResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /changes:
    get:
      tags: [Changes]
      operationId: listChanges
      summary: List authorized Drug lifecycle changes
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator, security_auditor]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: event_type
          in: query
          schema:
            $ref: "#/components/schemas/ChangeEventType"
        - name: detected_from
          in: query
          schema: { type: string, format: date-time }
        - name: detected_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Cursor page of changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /rag/query:
    post:
      tags: [RAG]
      operationId: queryRag
      summary: Ask a grounded question against authorized FDA Drug evidence
      description: Authorization and the fixed FDA Product=Drugs filter are applied before lexical/vector retrieval.
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagQueryRequest"
      responses:
        "200":
          description: Grounded answer or explicit insufficient-evidence result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagQueryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /rag/query/stream:
    post:
      tags: [RAG]
      operationId: streamRagQuery
      summary: Stream a provisional grounded answer and finish with a durable response
      description: >-
        Uses the same request, authorization, retrieval, validation, citation, and persistence
        contract as /rag/query. The response is UTF-8 NDJSON with exactly one RagStreamEvent per
        line. draft_delta text is provisional and must be cleared for its attempt after a
        draft_reset. Only complete.data is validated, committed, and authoritative. Provider
        thought parts and signatures are never emitted or persisted.
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagQueryRequest"
      responses:
        "200":
          description: >-
            NDJSON event stream. Runtime failures after streaming begins are represented by an
            error event rather than a second HTTP response.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/RagStreamEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /chat/threads:
    get:
      tags: [Chat]
      operationId: listChatThreads
      summary: List the authenticated caller's conversations
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Caller-owned conversation page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThreadPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Chat]
      operationId: createChatThread
      summary: Create an owner-scoped conversation
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatThreadCreate" }
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThreadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /chat/threads/{thread_id}:
    parameters:
      - name: thread_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Chat]
      operationId: getChatThread
      summary: Read one caller-owned conversation and its messages
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThreadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Chat]
      operationId: updateChatThread
      summary: Change title, model, retrieval, scope, or archive state
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatThreadPatch" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThreadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Chat]
      operationId: archiveChatThread
      summary: Archive one caller-owned conversation
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      responses:
        "204": { description: Conversation archived }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/threads/{thread_id}/focus:
    parameters:
      - name: thread_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Chat]
      operationId: focusChatThreadOnCitation
      summary: Focus a conversation on a document cited by one completed assistant answer
      description: >-
        Resolves the citation's current admitted Drug warning-letter document and version on
        the server, persists exact provenance, and changes retrieval to that single letter.
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatDocumentFocusSelect" }
      responses:
        "200":
          description: Conversation focused on the cited current document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThreadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Chat]
      operationId: clearChatThreadFocus
      summary: Clear the selected document and active-letter scope from a conversation
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      responses:
        "200":
          description: Conversation with document focus cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatThreadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /chat/threads/{thread_id}/messages/{client_message_id}/cancel:
    parameters:
      - name: thread_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: client_message_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [Chat]
      operationId: cancelPendingChatMessage
      summary: Cancel one caller-owned pending assistant response
      description: >-
        Idempotently marks the pending assistant response for the supplied client message ID as
        cancelled. A response that has already reached a terminal state is returned unchanged.
      x-required-roles: [viewer, regulatory_analyst, reviewer, system_administrator]
      responses:
        "200":
          description: Cancelled response, or the existing terminal response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /taxonomy:
