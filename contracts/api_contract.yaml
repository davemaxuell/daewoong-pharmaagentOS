        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Letters]
      operationId: createSavedView
      summary: Persist a caller-owned Drug-letter filter set and alert cadence
