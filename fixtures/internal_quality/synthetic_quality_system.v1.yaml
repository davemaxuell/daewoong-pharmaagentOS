  - source: SYS-LIMS-007
    target: SOP-DI-004
    relation_type: CONTROLLED_BY
    confidence: 1.0
    rationale: The system record explicitly identifies the audit-trail SOP.
    evidence:
      - asset: SYS-LIMS-007
        revision: 5
        anchor: governing-controls
      - asset: SOP-DI-004
        revision: 2
        anchor: risk-based-review
  - source: SYS-LIMS-007
    target: VAL-CS-021
    relation_type: VALIDATED_BY
    confidence: 1.0
    rationale: The system record explicitly identifies the validation protocol.
    evidence:
      - asset: SYS-LIMS-007
