name: fda-drug-intel-local

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fda_intel}
      POSTGRES_USER: ${POSTGRES_USER:-fda_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/local/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:7.4.11-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/local/.env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --save 60 1 --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [data]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/local/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/local/.env}
      MINIO_BROWSER_REDIRECT_URL: http://${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [data]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/local/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/local/.env}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-fda-raw-local}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORE_BUCKET}"
        mc version enable "local/$${OBJECT_STORE_BUCKET}"
        mc anonymous set none "local/$${OBJECT_STORE_BUCKET}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /root/.mc:size=4m,mode=0700
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks: [data]

  temporal:
    image: temporalio/auto-setup:1.28.1
    profiles: [agent-platform]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-fda_local}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/local/.env}
      DEFAULT_NAMESPACE: pharma-agent-os
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${TEMPORAL_PORT:-7233}:7233"
    restart: unless-stopped
    networks: [data]

  temporal-ui:
    image: temporalio/ui:2.42.1
    profiles: [agent-platform]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:${TEMPORAL_UI_PORT:-8233}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [data]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  data:
    internal: true
