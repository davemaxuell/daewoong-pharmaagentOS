apiVersion: v1
kind: Service
metadata:
  name: fda-api
  labels:
    app.kubernetes.io/name: fda-api
    app.kubernetes.io/part-of: fda-drug-intel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fda-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: fda-web
  labels:
    app.kubernetes.io/name: fda-web
    app.kubernetes.io/part-of: fda-drug-intel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fda-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pharma-mcp-gateway
  labels:
    app.kubernetes.io/name: pharma-mcp-gateway
    app.kubernetes.io/part-of: pharma-agent-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pharma-mcp-gateway
  ports:
    - name: http
      port: 8001
      targetPort: http
